or('فشل التحقق من الحزمة')}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=info.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);status.textContent='الحزمة جاهزة، بدأ التنزيل.'}catch(error){status.textContent='لم يكتمل التنزيل. حاول مرة أخرى، أو نزّل ملفات PDF بشكل مستقل.'}finally{button.disabled=false}});</script></body></html>
